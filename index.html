<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="header-brand">
        <img src="logo.webp" alt="Factor1" class="header-logo" width="42" height="42" />
        <h1>Org Explorer</h1>
      </div>
      <div class="header-actions">
        <button id="btn-full-tree" class="hidden" type="button">Full tree</button>
        <button id="btn-admin" class="hidden" type="button">Admin</button>
        <button id="btn-home" class="hidden" type="button">My profile</button>
        <button id="btn-signout" class="hidden" type="button">Sign out</button>
        <button id="btn-signin" class="primary" type="button">Sign in</button>
      </div>
    </header>

    <div id="demo-banner" class="demo-banner hidden">
      <span><strong>Preview mode</strong> — sample data. Sign in for live directory.</span>
      <button id="btn-live" type="button">Sign in with Microsoft</button>
    </div>
    <div id="setup-note" class="setup-note hidden"></div>
    <div id="status" class="status">Loading…</div>

    <div id="main-ui" class="hidden">
      <div class="toolbar">
        <div class="search-wrap">
          <input id="search-input" type="search" placeholder="Search by name…" autocomplete="off" />
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="toolbar-filters">
          <select id="company-filter" aria-label="Filter by company">
            <option value="">All companies</option>
          </select>
          <select id="dept-filter" aria-label="Filter by department">
            <option value="">All departments</option>
          </select>
          <select id="team-filter" aria-label="Filter by team">
            <option value="">All teams</option>
          </select>
        </div>
      </div>

      <div id="branch-view">
        <div class="tree-panel">
          <div class="branch-label">Current branch</div>
          <nav id="path-spine" class="path-spine hidden" aria-label="Branch path"></nav>
          <div class="tree-viewport" id="tree-viewport">
            <svg class="branch-svg" id="branch-svg" aria-hidden="true"></svg>
            <div id="tree-inner" class="tree-inner"></div>
          </div>
        </div>
      </div>

      <div id="full-tree-ui" class="full-tree-ui hidden">
        <div class="ft-toolbar">
          <div class="ft-toolbar-left">
            <button id="btn-ft-back" type="button">Back to explorer</button>
            <div class="ft-mode-toggle" role="group" aria-label="Tree mode">
              <button id="btn-ft-employees" type="button" class="active">Employees</button>
              <button id="btn-ft-structure" type="button">Structure</button>
            </div>
          </div>
          <div class="ft-toolbar-right">
            <span class="ft-hint">Drag to pan · Scroll to zoom</span>
            <button id="btn-ft-focus" type="button">Focus me</button>
          </div>
        </div>
        <div class="ft-panel">
          <div id="ft-loading" class="ft-loading hidden">Loading org…</div>
          <div id="ft-viewport" class="ft-viewport">
            <div id="ft-stage" class="ft-stage">
              <svg id="ft-svg" class="ft-svg" aria-hidden="true"></svg>
              <div id="ft-nodes" class="ft-nodes"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="admin-ui" class="admin-ui hidden">
        <div class="admin-toolbar">
          <button id="btn-admin-back" type="button">Back to explorer</button>
          <span class="admin-hint">Edit company, department, team, and role. Changes are written to Microsoft 365.</span>
        </div>
        <div class="admin-panel">
          <div class="admin-search">
            <input id="admin-search-input" type="search" placeholder="Search people to edit…" autocomplete="off" />
          </div>
          <div id="admin-results" class="admin-results"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="edit-drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="edit-drawer-title">
    <div class="drawer-backdrop" data-drawer-close></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2 id="edit-drawer-title">Edit details</h2>
        <button type="button" class="drawer-close" data-drawer-close aria-label="Close">×</button>
      </div>
      <p id="edit-drawer-person" class="drawer-person"></p>
      <form id="edit-form" class="drawer-form">
        <label class="drawer-field">
          <span>Company</span>
          <input id="edit-company" type="text" list="list-companies" autocomplete="off" />
        </label>
        <label class="drawer-field">
          <span>Department</span>
          <input id="edit-department" type="text" list="list-departments" autocomplete="off" />
        </label>
        <label class="drawer-field">
          <span>Team</span>
          <input id="edit-team" type="text" list="list-teams" autocomplete="off" />
          <small>Stored as CustomAttribute1 in Microsoft 365.</small>
        </label>
        <label class="drawer-field">
          <span>Role</span>
          <input id="edit-role" type="text" list="list-roles" autocomplete="off" />
        </label>
        <div id="edit-message" class="drawer-message hidden"></div>
        <div class="drawer-actions">
          <button type="button" id="btn-edit-cancel" data-drawer-close>Cancel</button>
          <button type="submit" id="btn-edit-save" class="primary">Save changes</button>
        </div>
      </form>
      <datalist id="list-companies"></datalist>
      <datalist id="list-departments"></datalist>
      <datalist id="list-teams"></datalist>
      <datalist id="list-roles"></datalist>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
